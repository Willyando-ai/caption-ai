<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Nota AI</title>
<style>
  body{
    font-family: sans-serif;
    background: #0B2620;
    color: #FBF6EC;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0;
    padding: 20px;
  }
  .box{
    background: #123C34;
    border-radius: 16px;
    padding: 32px;
    max-width: 420px;
    width: 100%;
  }
  h1{ font-size: 20px; margin-top:0; }
  label{ display:block; font-size:13px; color:#9DBBAE; margin: 14px 0 6px; }
  input, select{
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid rgba(251,246,236,0.2);
    background: rgba(251,246,236,0.06);
    color: #FBF6EC;
    box-sizing: border-box;
    font-size: 15px;
  }
  button{
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: none;
    background: #E85C4A;
    color: white;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
    margin-top: 20px;
  }
  .result{
    margin-top: 20px;
    padding: 16px;
    background: #FBF6EC;
    color: #1B2B27;
    border-radius: 10px;
    display: none;
  }
  .result.show{ display: block; }
  .kode{ font-size: 22px; font-weight: 700; font-family: monospace; word-break: break-all; margin: 8px 0; }
  .err{ color: #F2A93B; font-size: 13px; margin-top: 10px; display:none; }
  .err.show{ display:block; }
  .copy-hint{ font-size: 12px; color: #6b7a74; }
</style>
</head>
<body>
<div class="box">
  <h1>🔒 Admin Nota AI — Buat Kode Pembeli</h1>

  <label for="pw">Password Admin</label>
  <input type="password" id="pw" placeholder="Password admin kamu">

  <label for="hari">Berlaku Berapa Hari?</label>
  <select id="hari">
    <option value="30">30 hari (1 bulan)</option>
    <option value="14">14 hari (2 minggu)</option>
    <option value="7">7 hari (1 minggu)</option>
    <option value="90">90 hari (3 bulan)</option>
  </select>

  <button id="btn">Buat Kode Baru</button>

  <div class="err" id="err"></div>
  <div class="result" id="result">
    <div>Kode untuk pembeli ini:</div>
    <div class="kode" id="kodeText"></div>
    <div>Berlaku sampai: <b id="expiryText"></b></div>
    <div class="copy-hint">Copy kode di atas, kirim ke pembeli lewat chat.</div>
  </div>
</div>
<script>
document.getElementById('btn').addEventListener('click', async () => {
  const pw = document.getElementById('pw').value.trim();
  const hari = document.getElementById('hari').value;
  const errEl = document.getElementById('err');
  const resultEl = document.getElementById('result');
  errEl.classList.remove('show');
  resultEl.classList.remove('show');

  if(!pw){ errEl.textContent = 'Isi password dulu.'; errEl.classList.add('show'); return; }

  try{
    const res = await fetch('/api/admin-code', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ password: pw, hari })
    });
    const data = await res.json();
    if(!res.ok){ throw new Error(data.error || 'Gagal membuat kode'); }
    document.getElementById('kodeText').textContent = data.kode;
    document.getElementById('expiryText').textContent = data.kadaluarsa;
    resultEl.classList.add('show');
  }catch(e){
    errEl.textContent = e.message;
    errEl.classList.add('show');
  }
});
</script>
</body>
</html>
